[package]
name = "effect-capability-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace]

[dependencies]
effect = { path = "../../..", default-features = false }

[lints.rust]
warnings = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
codegen-units = 1
incremental = false
lto = true
opt-level = "s"
strip = true
