[package]
name = "effect-mixed-provider-consumer"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
effect = { path = "../../..", default-features = false }
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[lints.rust]
warnings = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
codegen-units = 1
incremental = false
lto = true
opt-level = "s"
strip = true
