[workspace]
members = [
    "native_build/rust_async",
    "crates/native_interop",
    "crates/sqlx",
    "crates/sqlx_turso",
    "crates/sqlx_turso_cli",
    "crates/sqlx_turso_core",
    "crates/sqlx_turso_macros",
    "crates/effect",
    "crates/effect_macros",
    "crates/effect_tokio",
    "crates/effect_rayon",
    "crates/effect_native_runtime",
    "crates/effect_tracing",
    "crates/effect_app",
    "crates/effect_sql",
    "crates/effect_server",
    "crates/effect_server_identity",
    "crates/effect_server_web",
    "crates/effect_otel",
]
resolver = "3"

[workspace.dependencies]
# One native HTTP and OTel type family is shared by the optional extensions.
axum = { version = "0.8.9", default-features = false }
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
headers = "0.4.2"
cookie = "0.18.2"
maud = { version = "0.27.0", features = ["axum"] }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
tracing-opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry-appender-tracing = { version = "0.32.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
# Native algorithms/managers only; SQLx supplies all selected persistence.
identity_rs = { git = "https://github.com/OUTCASTGEEK-TECH/identity.rs.git", rev = "7ba00864e5fcf1b45a007d7ef689f3500fb7c922", default-features = false, features = ["axum"] }
async-stream = "0.3.6"
chrono = "0.4.45"
clap = "4.6.7"
either = "1.18.0"
futures-core = "0.3.34"
futures-util = "0.3.34"
log = "0.4.34"
percent-encoding = "2.3.2"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
serde_stacker = "0.1.14"
sqlx = { path = "crates/sqlx", package = "sqlx-turso-sqlx", default-features = false, features = ["derive", "runtime-tokio"] }
sqlx-upstream = { package = "sqlx", version = "=0.9.0", default-features = false }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["offline"] }
sqlx-macros = { version = "=0.9.0", default-features = false }
sqlx-macros-core = { version = "=0.9.0", default-features = false }
syn = "3.0.6"
# SQLx 0.9 exposes QueryMacroInput through Syn 2's Parse trait.
syn-sqlx = { package = "syn", version = "2.0.119" }
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
turso = { version = "0.8.0-pre.13", default-features = false }
turso_parser = { version = "=0.8.0-pre.13" }
url = "2.5.8"
uuid = "1.26.1"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
disallowed_methods = "deny"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
dead_code = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
codegen-units = 1
incremental = false
lto = true
opt-level = "s"
strip = true
